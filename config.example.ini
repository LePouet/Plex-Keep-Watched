# plex-keep-watched configuration
#
# Copy this file to "config.ini" (next to the script) and edit it:
#     cp config.example.ini config.ini
# config.ini contains your Plex token: keep it private (chmod 600 config.ini)
# and never commit it (it is listed in .gitignore).
#
# Put comments on their own line, not after a value.
# An empty value means "use the default".
# Environment variables PLEX_URL, PLEX_TOKEN, TAUTULLI_URL, TAUTULLI_API_KEY and
# KEEP_WATCHED_DATA_DIR override the matching settings below.

[plex]
# Address of your Plex Media Server.
url = http://192.168.1.10:32400

# Your Plex token (required). In Plex Web: open an item, "..." menu,
# "Get Info", "View XML": the token is the X-Plex-Token value in the URL.
token = YOUR_PLEX_TOKEN


[behavior]
# A play shorter than this is a "short play" (misclick, quick look): the movie
# is marked as watched again on the next run.
short_play_minutes = 5

# For a real watch (longer than the above): wait this many hours without any
# change of position before marking the movie as watched again. If you resume
# the movie, the countdown restarts.
delay_hours = 48

# Also handle TV show episodes, not only movies (true / false).
include_episodes = false


[tautulli]
# Optional. Leave BOTH empty to disable Tautulli.
# With Tautulli, "short" is judged on the time actually played instead of the
# resume position, so "jumped to minute 42, watched 30 seconds" counts as short.
#
# ATTENTION: by default, Tautulli does NOT record a play shorter than 2 minutes.
# Short plays would then be invisible to this script, which would fall back to
# the resume position and could take them for real watches.
# To fix it: in Tautulli, Settings > General, set "Logging Ignore Interval"
# (minimum duration before a play is recorded, 120 s by default; the label may
# differ slightly between versions) to 1 second.
#
# Example: http://192.168.1.10:8181
url =
# Tautulli > Settings > Web Interface > API Key
api_key =


[logging]
# keep_watched.log: the last changes (movies marked as watched), warnings and
# errors. Set to false if you do not want this file. Warnings and errors are
# still printed on stderr, and the script's exit code still reports a failure.
basic_log = true

# Detailed log of every run in keep_watched_verbose.log: what is marked
# watched, what is waiting (and until when), what is skipped and why.
# It contains everything the basic log has, so it works with basic_log = false.
# You can also enable it for one manual run with: plex_keep_watched.py --verbose
verbose = false

# How many lines each log file keeps (the oldest lines are dropped).
max_lines = 100
verbose_max_lines = 2000


[files]
# Folder for the state file (countdowns, required) and the log files.
# Empty = next to the script. Use an absolute path, e.g. /var/lib/plex-keep-watched
# The folder is created if needed.
data_dir =
